spring:
  application:
    name: hotel-ai-os-core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_ai_os}
    username: ${DB_USERNAME:hotel_ai_os_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:hotel_ai_os_app}}
    password: ${DB_MIGRATION_PASSWORD}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:200MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:202MB}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai-evidence:
    # Shadow only. External processing requires a separate privacy/provider approval.
    enabled: ${AI_EVIDENCE_ENABLED:false}
    external-processing-approved: ${AI_EVIDENCE_EXTERNAL_APPROVED:false}
    provider: ${AI_EVIDENCE_PROVIDER:qwen}
    # Key must belong to the explicitly selected provider. Never borrow another service's key.
    api-key: ${AI_EVIDENCE_API_KEY:}
    # Blank model/endpoint selects provider-specific defaults, not a cross-provider fallback.
    model: ${AI_EVIDENCE_MODEL:}
    endpoint: ${AI_EVIDENCE_ENDPOINT:}
    tenant-ids: ${AI_EVIDENCE_TENANT_IDS:}
    pilot-hotel-ids: ${AI_EVIDENCE_PILOT_HOTEL_IDS:}
    daily-request-limit: ${AI_EVIDENCE_DAILY_REQUEST_LIMIT:100}
    fixed-delay-ms: ${AI_EVIDENCE_FIXED_DELAY_MS:10000}
  academy:
    storage-root: ${ACADEMY_STORAGE_ROOT:${ATTACHMENT_STORAGE_ROOT:var/attachments}/academy}
    worker-enabled: ${ACADEMY_WORKER_ENABLED:false}
    tenant-ids: ${ACADEMY_TENANT_IDS:}
    fixed-delay-ms: ${ACADEMY_FIXED_DELAY_MS:30000}
  finance:
    # Separate originals, but inside the mounted attachment volume by default. Never use operational retention rules here.
    attachments-root: ${FINANCE_ATTACHMENTS_ROOT:${ATTACHMENT_STORAGE_ROOT:var/attachments}/finance-originals}
  store-cost:
    pms-source:
      # Read-only sanitized PMS aggregates. Tenant binding is mandatory; disabled by default.
      tenant-id: ${STORE_COST_PMS_TENANT_ID:}
      allowed-tenant-code: ${STORE_COST_PMS_TENANT_CODE:${KPI_OTA_ALLOWED_TENANT_CODE:}}
      hotel-directory-path: ${STORE_COST_PMS_HOTEL_DIRECTORY_PATH:${KPI_OTA_HOTEL_DIRECTORY_PATH:}}
      summary-path: ${STORE_COST_PMS_SUMMARY_PATH:${KPI_PMS_MONTHLY_SUMMARY_PATH:}}
  group-management:
    work-plans-enabled: ${GROUP_MANAGEMENT_WORK_PLANS_ENABLED:false}
    executive-tasks-enabled: ${GROUP_MANAGEMENT_EXECUTIVE_TASKS_ENABLED:false}
    reminder-worker-enabled: ${GROUP_MANAGEMENT_REMINDER_WORKER_ENABLED:false}
    tenant-ids: ${GROUP_MANAGEMENT_TENANT_IDS:}
  kpi:
    ota-source:
      snapshot-path: ${KPI_OTA_SNAPSHOT_PATH:}
      hotel-directory-path: ${KPI_OTA_HOTEL_DIRECTORY_PATH:}
      allowed-tenant-code: ${KPI_OTA_ALLOWED_TENANT_CODE:}
      monthly-summary-path: ${KPI_PMS_MONTHLY_SUMMARY_PATH:}
  automation:
    worker:
      enabled: ${AUTOMATION_WORKER_ENABLED:false}
      tenant-ids: ${AUTOMATION_WORKER_TENANT_IDS:}
      batch-size: ${AUTOMATION_WORKER_BATCH_SIZE:100}
      fixed-delay-ms: ${AUTOMATION_WORKER_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${AUTOMATION_WORKER_INITIAL_DELAY_MS:30000}
  tasks:
    default-escalation-delay-hours: ${TASK_DEFAULT_ESCALATION_DELAY_HOURS:48}
  security:
    development-header-auth-enabled: ${DEV_HEADER_AUTH_ENABLED:false}
    local-login:
      enabled: ${LOCAL_LOGIN_ENABLED:false}
      secret: ${LOCAL_LOGIN_SECRET:}
      issuer: ${LOCAL_LOGIN_ISSUER:hotel-ai-os-pilot}
      token-ttl-hours: ${LOCAL_LOGIN_TOKEN_TTL_HOURS:8}
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:}
      audience: ${JWT_AUDIENCE:hotel-ai-os-api}
      tenant-id-claim: ${JWT_TENANT_ID_CLAIM:tenant_id}
      account-id-claim: ${JWT_ACCOUNT_ID_CLAIM:account_id}
  database:
    rls-enabled: ${DB_RLS_ENABLED:true}
  data-retention:
    # Both the deployment gate and tenant policy must be enabled.
    cleanup-worker-enabled: ${DATA_RETENTION_CLEANUP_WORKER_ENABLED:false}
    tenant-ids: ${DATA_RETENTION_TENANT_IDS:}
    fixed-delay-ms: ${DATA_RETENTION_FIXED_DELAY_MS:300000}
  work-expectation:
    sla:
      scheduler-enabled: ${WORK_EXPECTATION_SLA_SCHEDULER_ENABLED:false}
      tenant-ids: ${WORK_EXPECTATION_SLA_TENANT_IDS:}
      batch-size: ${WORK_EXPECTATION_SLA_BATCH_SIZE:100}
      fixed-delay-ms: ${WORK_EXPECTATION_SLA_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${WORK_EXPECTATION_SLA_INITIAL_DELAY_MS:30000}
  procurement:
    scheduler-enabled: ${PROCUREMENT_SCHEDULER_ENABLED:false}
    tenant-ids: ${PROCUREMENT_TENANT_IDS:}
    fixed-delay-ms: ${PROCUREMENT_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${PROCUREMENT_INITIAL_DELAY_MS:30000}
  attachments:
    # Procurement evidence lives in a child directory of this backed-up root.
    root: ${ATTACHMENT_STORAGE_ROOT:var/attachments}
    max-size-bytes: ${ATTACHMENT_MAX_SIZE_BYTES:20971520}
    scan:
      command-path: ${ATTACHMENT_SCAN_COMMAND_PATH:}
      command-arguments: ${ATTACHMENT_SCAN_COMMAND_ARGUMENTS:}
      timeout-seconds: ${ATTACHMENT_SCAN_TIMEOUT_SECONDS:60}
      allow-sanitized-image-fallback: ${ATTACHMENT_SCAN_ALLOW_SANITIZED_IMAGE_FALLBACK:false}
  wecom:
    enabled: ${WECOM_ENABLED:false}
    # Directory callbacks and automatic onboarding are independently enabled.
    # Enabling this does not enable any group robot or outbound group delivery.
    directory-sync-enabled: ${WECOM_DIRECTORY_SYNC_ENABLED:false}
    directory:
      callback-token: ${WECOM_DIRECTORY_CALLBACK_TOKEN:}
      callback-aes-key: ${WECOM_DIRECTORY_CALLBACK_AES_KEY:}
      receive-id: ${WECOM_DIRECTORY_RECEIVE_ID:}
      encryption-key: ${WECOM_DIRECTORY_ENCRYPTION_KEY:}
      oauth-callback-url: ${WECOM_DIRECTORY_OAUTH_CALLBACK_URL:}
      invitation-ttl-minutes: ${WECOM_DIRECTORY_INVITATION_TTL_MINUTES:120}
      # Shared QR entry only; per-employee invitations and OAuth sessions stay short-lived.
      shared-invitation-ttl-days: ${WECOM_DIRECTORY_SHARED_INVITATION_TTL_DAYS:7}
      exchange-ttl-minutes: ${WECOM_DIRECTORY_EXCHANGE_TTL_MINUTES:2}
      session-ttl-minutes: ${WECOM_DIRECTORY_SESSION_TTL_MINUTES:30}
      callback-clock-skew-seconds: ${WECOM_DIRECTORY_CALLBACK_CLOCK_SKEW_SECONDS:600}
      recovery-delay-ms: ${WECOM_DIRECTORY_RECOVERY_DELAY_MS:15000}
      recovery-initial-delay-ms: ${WECOM_DIRECTORY_RECOVERY_INITIAL_DELAY_MS:15000}
      candidate-expiry-delay-ms: ${WECOM_DIRECTORY_CANDIDATE_EXPIRY_DELAY_MS:60000}
      candidate-expiry-initial-delay-ms: ${WECOM_DIRECTORY_CANDIDATE_EXPIRY_INITIAL_DELAY_MS:60000}
    # Independent of WECOM_ENABLED: this protects store robot addresses at rest.
    # It must be a Base64-encoded 32-byte value and is never packaged in source.
    group-robot:
      encryption-key: ${WECOM_GROUP_ROBOT_ENCRYPTION_KEY:}
      delivery-enabled: ${WECOM_GROUP_ROBOT_DELIVERY_ENABLED:false}
      pilot-hotel-id: ${WECOM_GROUP_ROBOT_PILOT_HOTEL_ID:}
      delivery-not-before: ${WECOM_GROUP_ROBOT_DELIVERY_NOT_BEFORE:}
      batch-size: ${WECOM_GROUP_ROBOT_BATCH_SIZE:20}
      fixed-delay-ms: ${WECOM_GROUP_ROBOT_FIXED_DELAY_MS:30000}
      initial-delay-ms: ${WECOM_GROUP_ROBOT_INITIAL_DELAY_MS:30000}
    tenant-id: ${WECOM_TENANT_ID:}
    corp-id: ${WECOM_CORP_ID:}
    agent-id: ${WECOM_AGENT_ID:}
    corp-secret: ${WECOM_CORP_SECRET:}
    callback-token: ${WECOM_CALLBACK_TOKEN:}
    callback-aes-key: ${WECOM_CALLBACK_AES_KEY:}
    bot-id: ${WECOM_BOT_ID:}
    bot-receive-id: ${WECOM_BOT_RECEIVE_ID:}
    bot:
      actions-enabled: ${WECOM_BOT_ACTIONS_ENABLED:false}
    frontend-base-url: ${WECOM_FRONTEND_BASE_URL:http://localhost:5173}
    oauth-callback-url: ${WECOM_OAUTH_CALLBACK_URL:}
    http:
      connect-timeout-ms: ${WECOM_HTTP_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${WECOM_HTTP_READ_TIMEOUT_MS:5000}
    oauth:
      state-ttl-minutes: ${WECOM_OAUTH_STATE_TTL_MINUTES:10}
      exchange-ttl-minutes: ${WECOM_OAUTH_EXCHANGE_TTL_MINUTES:2}
      session-ttl-minutes: ${WECOM_OAUTH_SESSION_TTL_MINUTES:30}
      pending-limit: ${WECOM_OAUTH_PENDING_LIMIT:500}
    worker:
      enabled: ${WECOM_WORKER_ENABLED:false}
      batch-size: ${WECOM_WORKER_BATCH_SIZE:50}
      fixed-delay-ms: ${WECOM_WORKER_FIXED_DELAY_MS:30000}
      initial-delay-ms: ${WECOM_WORKER_INITIAL_DELAY_MS:30000}
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}
