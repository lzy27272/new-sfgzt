openapi: 3.1.0
info:
  title: Hotel AI OS Core API
  version: 0.2.5-pilot.8
  description: >-
    PRODUCT-V1.4 / TECH-V0.2-PILOT.8 contract. Production requests use a
    trusted JWT/SSO bearer token; roles, permissions, organization scope and
    active position assignments are resolved by the server. X-Tenant-Id and
    X-Actor-Id are accepted only when DEV_HEADER_AUTH_ENABLED=true for local
    integration. Client-supplied role or organization-scope headers are never
    trusted.
servers:
  - url: http://localhost:8080
security:
  - BearerAuth: []
  - TenantHeader: []
    ActorHeader: []
tags:
  - name: Organization
  - name: IAM
  - name: Standard Center
  - name: Work Package
  - name: Work Data
  - name: Rule Engine
  - name: Task Center
  - name: Group Executive Task
  - name: Evaluation
  - name: Notification
  - name: Metrics
  - name: Dashboard
  - name: Enterprise Template
  - name: Store Resource
paths:
  /api/v1/org/units:
    get:
      tags: [Organization]
      operationId: listOrganizationUnits
      summary: List visible organization units
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [GROUP, REGION, HOTEL, DEPARTMENT] }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization]
      operationId: createOrganizationUnit
      summary: Create an organization unit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrgUnit' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/org/positions:
    get:
      tags: [Organization]
      operationId: listPositions
      summary: List position definitions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Organization]
      operationId: createPosition
      summary: Create a position definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePosition' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/org/units/{orgUnitId}:
    put:
      tags: [Organization]
      operationId: updateOrganizationUnit
      summary: Edit or activate/deactivate an organization unit without moving its hierarchy
      parameters:
        - { name: orgUnitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrgUnit' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Organization]
      operationId: deleteUnusedOrganizationUnit
      summary: Delete an inactive, childless and unreferenced organization unit
      parameters:
        - { name: orgUnitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/org/positions/{positionId}:
    put:
      tags: [Organization]
      operationId: updatePosition
      summary: Edit or activate/deactivate a position definition
      parameters:
        - { name: positionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePosition' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Organization]
      operationId: deleteUnusedPosition
      summary: Delete an inactive and unreferenced position definition
      parameters:
        - { name: positionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/org/employees:
    get:
      tags: [Organization]
      operationId: listEmployees
      summary: List visible employees and active assignments
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Organization]
      operationId: createEmployee
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployee' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/org/employees/{employeeId}:
    put:
      tags: [Organization]
      operationId: updateEmployee
      summary: Edit employee/account details or activate/deactivate the employee
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployee' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Organization]
      operationId: deleteUnusedEmployee
      summary: Delete an inactive employee without assignments, work or audit history
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/org/employees/{employeeId}/assignments:
    post:
      tags: [Organization]
      operationId: createPositionAssignment
      summary: Assign a position to an employee; supports multiple positions
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePositionAssignment' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/iam/me:
    get:
      tags: [IAM]
      operationId: getCurrentIdentity
      summary: Resolve the current account, roles, permissions, scopes and assignments
      parameters:
        - $ref: '#/components/parameters/AssignmentHeader'
      responses:
        '200':
          description: Effective server-side identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/iam/permissions:
    get:
      tags: [IAM]
      operationId: listPermissions
      summary: List permission definitions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /api/v1/iam/roles:
    get:
      tags: [IAM]
      operationId: listRoles
      summary: List tenant roles
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [IAM]
      operationId: createRole
      summary: Create a tenant-managed CUSTOM role
      description: >-
        Generic IAM can create CUSTOM roles only. SYSTEM roles are maintained by
        published position profiles or controlled database migrations. A successful
        creation is written to the append-only audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRole' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/iam/roles/{roleId}/permissions:
    put:
      tags: [IAM]
      operationId: replaceRolePermissions
      summary: Replace a CUSTOM role permission set
      description: >-
        Replaces the complete permission set of a tenant-owned CUSTOM role and writes
        the before/after permission codes to the append-only audit log. SYSTEM roles
        cannot be changed through generic IAM.
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolePermissions' }
      responses:
        '204': { description: Permissions replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/iam/role-assignments:
    post:
      tags: [IAM]
      operationId: grantRole
      summary: Grant a time-bounded CUSTOM role within an organization scope
      description: >-
        Generic IAM grants tenant-managed CUSTOM roles only and records the change in
        the append-only audit log. SYSTEM roles are assigned through published position
        profiles or controlled provisioning.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantRole' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/standards/categories:
    get:
      tags: [Standard Center]
      operationId: listStandardCategories
      summary: List standard categories
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /api/v1/standards:
    get:
      tags: [Standard Center]
      operationId: listStandards
      summary: List standards and latest visible versions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Standard Center]
      operationId: createStandard
      summary: Create a standard definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStandard' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/standards/{standardId}/versions:
    post:
      tags: [Standard Center]
      operationId: createStandardVersion
      summary: Create a draft standard version and applicability scopes
      parameters:
        - $ref: '#/components/parameters/StandardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStandardVersion' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/standards/{standardId}/versions/{versionId}/publish:
    post:
      tags: [Standard Center]
      operationId: publishStandardVersion
      summary: Publish an immutable standard version
      parameters:
        - $ref: '#/components/parameters/StandardId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishEffectiveWindow' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/work-packages:
    get:
      tags: [Work Package]
      operationId: listWorkPackages
      summary: List visible work package definitions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Work Package]
      operationId: createWorkPackage
      summary: Create a work package definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkPackage' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-packages/{workPackageId}:
    get:
      tags: [Work Package]
      operationId: getWorkPackage
      summary: Get a work package with versions
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-packages/{workPackageId}/versions:
    post:
      tags: [Work Package]
      operationId: createWorkPackageVersion
      summary: Create a draft work package version
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkPackageVersion' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-packages/{workPackageId}/versions/{versionId}:
    put:
      tags: [Work Package]
      operationId: updateWorkPackageVersion
      summary: Replace draft version scopes and items
      description: Replaces the complete multi-item configuration for a draft version. Published versions are immutable.
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkPackageVersion' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-packages/{workPackageId}/versions/{versionId}/validate:
    post:
      tags: [Work Package]
      operationId: validateWorkPackageVersion
      summary: Validate a draft before publication
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-packages/{workPackageId}/versions/{versionId}/publish:
    post:
      tags: [Work Package]
      operationId: publishWorkPackageVersion
      summary: Publish a validated work package version
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishEffectiveWindow' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-packages/{workPackageId}/versions/{versionId}/retire:
    post:
      tags: [Work Package]
      operationId: retireWorkPackageVersion
      summary: Retire a published work package version
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetireWorkPackageVersion' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-packages/{workPackageId}/allocations:
    get:
      tags: [Work Package]
      operationId: listWorkPackageAllocations
      summary: List work package allocations
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Work Package]
      operationId: createWorkPackageAllocation
      summary: Allocate a published work package version to an assignment and target organization
      parameters:
        - $ref: '#/components/parameters/WorkPackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkPackageAllocation' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-duty-periods:
    get:
      tags: [Work Package]
      operationId: listWorkDutyPeriods
      summary: List duty periods
      parameters:
        - { name: positionAssignmentId, in: query, schema: { type: string, format: uuid } }
        - { name: targetOrgUnitId, in: query, schema: { type: string, format: uuid } }
        - { name: businessDate, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Work Package]
      operationId: createWorkDutyPeriod
      summary: Create an assignment duty period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkDutyPeriod' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-expectations:
    get:
      tags: [Work Package]
      operationId: listWorkExpectations
      summary: List visible generated work expectations
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: positionAssignmentId, in: query, schema: { type: string, format: uuid } }
        - { name: targetOrgUnitId, in: query, schema: { type: string, format: uuid } }
        - { name: businessDate, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /api/v1/my/work-expectations:
    get:
      tags: [Work Package]
      operationId: listMyWorkExpectations
      summary: List expectations assigned to the current actor's active position assignments
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: businessDate, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /api/v1/team/work-expectations:
    get:
      tags: [Work Package]
      operationId: listTeamWorkExpectations
      summary: List expectations for the current manager's team
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: businessDate, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /api/v1/work-expectations/{expectationId}:
    get:
      tags: [Work Package]
      operationId: getWorkExpectation
      summary: Get an expectation and its immutable source snapshot
      parameters:
        - $ref: '#/components/parameters/ExpectationId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-expectations/actions/generate:
    post:
      tags: [Work Package]
      operationId: generateWorkExpectations
      summary: Generate idempotent expectations for an assignment, organization and business date
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateWorkExpectations' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-expectations/sla/process:
    post:
      tags: [Work Package]
      operationId: processWorkExpectationSla
      summary: Mark overdue work expectations MISSED and emit WorkExpectationMissed events
      description: >-
        Requires work-package.manage. Candidates in PLANNED, AVAILABLE or IN_PROGRESS
        whose dueAt is before the processing time are changed to MISSED. Each changed
        expectation produces an audit record and transactional outbox event. Processing
        is tenant-isolated, batched, ordered and safe under concurrent calls.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: SLA processing result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkExpectationSlaProcessResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/work-expectations/{expectationId}/waive:
    post:
      tags: [Work Package]
      operationId: waiveWorkExpectation
      summary: Waive an expectation using optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/ExpectationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectationAction' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/work-expectations/{expectationId}/cancel:
    post:
      tags: [Work Package]
      operationId: cancelWorkExpectation
      summary: Cancel an expectation using optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/ExpectationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectationAction' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/work-data/forms:
    get:
      tags: [Work Data]
      operationId: listWorkForms
      summary: List position forms and latest versions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Work Data]
      operationId: createWorkForm
      summary: Create a position form definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateForm' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-data/forms/{formId}/versions:
    post:
      tags: [Work Data]
      operationId: createWorkFormVersion
      summary: Create a JSON Schema form version
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFormVersion' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-data/forms/{formId}/versions/{versionId}/publish:
    post:
      tags: [Work Data]
      operationId: publishWorkFormVersion
      summary: Publish an immutable form version
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-data/records:
    get:
      tags: [Work Data]
      operationId: listWorkRecords
      summary: List work records in effective data scope
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Work Data]
      operationId: createWorkRecord
      summary: Create a draft or submitted work record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitWorkRecord' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/work-data/records/{recordId}:
    get:
      tags: [Work Data]
      operationId: getWorkRecord
      summary: Get one work record with review and work-package linkage
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
    put:
      tags: [Work Data]
      operationId: updateWorkRecordDraft
      summary: Update a draft using expectedVersion
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkRecordDraft' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/work-data/records/{recordId}/actions/submit:
    post:
      tags: [Work Data]
      operationId: submitWorkRecordDraft
      summary: Submit a draft using expectedVersion
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitWorkRecordDraft' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/work-data/records/{recordId}/actions/review:
    post:
      tags: [Work Data]
      operationId: reviewWorkRecord
      summary: Approve or reject a submitted work record
      description: >-
        Requires work-record.review and organization scope. The submitting account cannot
        review its own record. reason is mandatory when outcome is REJECTED.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewWorkRecord' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/work-data/records/{recordId}/supplements:
    post:
      tags: [Work Data]
      operationId: addWorkRecordSupplement
      summary: Append an immutable statement to a submitted work record
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddWorkRecordSupplement' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/work-data/records/{recordId}/attachments:
    get:
      tags: [Work Data]
      operationId: listWorkRecordAttachments
      summary: List stored image attachments for a visible work record
      description: Requires work-record.read and organization-scope access to the work record.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Attachment metadata in creation order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StoredAttachment' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Work Data]
      operationId: addWorkRecordAttachment
      summary: Register attachment metadata without uploading binary content
      description: Legacy metadata-only endpoint. Use the multipart upload endpoint for UAT image evidence.
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddAttachment' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/work-data/records/{recordId}/attachments/upload:
    post:
      tags: [Work Data]
      operationId: uploadWorkRecordImage
      summary: Upload and persist a JPEG or PNG work-record attachment
      description: >-
        Requires work-record.submit and access to the exact submitting assignment (or
        work-record.submit-for-other). The service validates actual image content,
        accepts image/jpeg and image/png, enforces the configured size limit (10 MiB by
        default), stores the binary and computes SHA-256. In formal mode malware scanning
        is fail-closed: a missing or unavailable scanner, timeout, non-zero exit, or rejected
        file fails the upload without creating attachment metadata. CLEAN means the configured
        scanner actually returned success. BYPASSED_DEV may only be produced and downloaded
        when development-header authentication is explicitly enabled. TECH-V0.2 RC exercised
        this contract with ClamAV 1.5.3 and a signed CVD database. Approved or rejected records
        are immutable.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        '201':
          description: Stored attachment metadata and content URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedAttachment' }
        '400':
          description: Invalid image or malware scanner unavailable, timed out, failed, or rejected the file
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/work-data/attachments/{attachmentId}/content:
    get:
      tags: [Work Data]
      operationId: downloadWorkRecordAttachment
      summary: Read stored work-record image content inline
      description: Requires work-record.read and organization-scope access to the owning work record.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Original JPEG or PNG content with an inline Content-Disposition filename
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/work-data/records/{recordId}/attachments/{attachmentId}:
    delete:
      tags: [Work Data]
      operationId: deleteWorkRecordAttachment
      summary: Delete a stored image attachment from a mutable work record
      description: >-
        Requires work-record.submit and access to the submitting assignment (or
        work-record.submit-for-other). Approved or rejected records are immutable.
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204':
          description: Attachment metadata and binary content deleted
        '403': { $ref: '#/components/responses/Forbidden' }
