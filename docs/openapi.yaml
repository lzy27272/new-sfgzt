    CreateStoreResourceItem:
      type: object
      description: Per-hotel item. Inventory, reference unitCost and minimumQuantity use the base unit. Aliases are optional; an alias with a different name requires an explicit positive conversion factor.
      additionalProperties: false
      required: [sku, name, category, unit, unitCost, minimumQuantity]
      properties:
        sku: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        category:
          type: string
          enum: [CONSUMABLE, LINEN, CLEANING_SUPPLY, OPERATING_ITEM]
        unit: { type: string, minLength: 1, maxLength: 32 }
        unitCost: { type: number, minimum: 0 }
        minimumQuantity: { type: number, minimum: 0 }
        specification: { type: [string, 'null'], maxLength: 240 }
        purchaseUnit: { type: [string, 'null'], maxLength: 32, description: Defaults to the base unit when omitted. }
        purchaseFactor: { $ref: '#/components/schemas/StoreItemUnitFactor' }
        issueUnit: { type: [string, 'null'], maxLength: 32, description: Issue or consumption entry unit; defaults to base unit. }
        issueFactor: { $ref: '#/components/schemas/StoreItemUnitFactor' }
        employeeUsageEnabled: { type: [boolean, 'null'], description: Existing employee catalogue opt-in flag; does not grant workflow permissions. }
        usageScope: { $ref: '#/components/schemas/StoreItemUsageScopeInput' }
    UpdateStoreResourceItem:
      type: object
      description: Optimistic item configuration update. Omitted unit metadata preserves current settings. The base unit is immutable after any stock movement, even if stock is zero. Alias changes affect future postings only.
      additionalProperties: false
      required: [sku, name, category, unit, unitCost, minimumQuantity, expectedVersion]
      properties:
        sku: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        category:
          type: string
          enum: [CONSUMABLE, LINEN, CLEANING_SUPPLY, OPERATING_ITEM]
        unit: { type: string, minLength: 1, maxLength: 32 }
        unitCost: { type: number, minimum: 0 }
        minimumQuantity: { type: number, minimum: 0 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        specification: { type: [string, 'null'], maxLength: 240 }
        purchaseUnit: { type: [string, 'null'], maxLength: 32 }
        purchaseFactor: { $ref: '#/components/schemas/StoreItemUnitFactor' }
        issueUnit: { type: [string, 'null'], maxLength: 32 }
        issueFactor: { $ref: '#/components/schemas/StoreItemUnitFactor' }
        employeeUsageEnabled: { type: [boolean, 'null'] }
        usageScope: { $ref: '#/components/schemas/StoreItemUsageScopeInput' }
    StoreItemUsageScopeInput:
      type: [object, 'null']
      description: Employee selection and submission scope; does not grant organizational access. Omitted/null creates LEGACY on old clients and preserves existing scopes on update. LEGACY items remain in administrative inventory and historical evidence but are not selectable for new employee issue/usage until explicitly configured. New configuration must select ALL_DEPARTMENTS or DEPARTMENTS. DEPARTMENTS requires at least one active department within this hotel; ALL_DEPARTMENTS requires an empty departmentIds array. Empty positionIds means all positions within the selected departments, not all departments. Department and position restrictions must both match the current assignment. No ledger split, approval change or stored quick-list rewrite. Read responses include usage_scope.mode (including LEGACY), departmentIds, positionIds and department/position label snapshots.
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [ALL_DEPARTMENTS, DEPARTMENTS] }
        departmentIds:
          type: [array, 'null']
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
        positionIds:
          type: [array, 'null']
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
    StoreItemUnitFactor:
      type: [number, string, 'null']
      description: One alias unit equals this many base units. Exact positive decimal with at most 12 integer and 6 fractional digits; strings preserve decimal precision. Same-name units must have identical factors, and the base unit factor must be 1.
    StoreResourceVersionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: [string, 'null'] }
    CreateStoreInventoryMovement:
      type: object
      additionalProperties: false
      required: [itemId, movementType, quantity, reason]
      properties:
        itemId: { type: string, format: uuid }
        movementType:
          type: string
          enum: [RECEIPT, CONSUMPTION, RETURN, DAMAGE, ADJUSTMENT]
        quantity:
          type: [number, string]
          description: Quantity in quantityUnit. Magnitude for receipt, consumption, return and damage; signed delta for adjustment. At most 14 integer and 4 fractional digits, including the converted base quantity. Rejects lossy conversion rather than rounding. Strings preserve decimal precision.
        quantityUnit: { type: [string, 'null'], maxLength: 32, description: A configured base/purchase/issue unit; defaults to base unit. Server selects the factor from locked item configuration; clients cannot supply a posting factor. }
        expectedItemVersion: { type: [integer, 'null'], format: int64, minimum: 0, description: Rejects stale unit configuration on new postings; an exact idempotent replay still returns original facts. }
        unitCost: { type: [number, string, 'null'], description: Nonnegative price per selected input unit, at most 14 integer and 4 fractional digits. Used only for positive postings. Omission uses weighted-average inventory cost. Outflows always use weighted-average cost. }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        occurredAt: { type: [string, 'null'], format: date-time }
