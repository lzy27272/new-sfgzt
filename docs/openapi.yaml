  /api/v1/tasks/{taskId}/actions/{command}:
    post:
      tags: [Task Center]
      operationId: transitionTask
      summary: Apply an idempotent task state command using expectedVersion
      description: >-
        The exact task participant assignment is validated for every command. A task bound
        to a standard must complete its standard evaluation before approve/rework/reject.
        A task without a bound standard may be approved or rejected directly from
        RESULT_SUBMITTED by its designated reviewer; that manual path is audited.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: command
          in: path
          required: true
          schema:
            type: string
            enum: [dispatch, acknowledge, start, submit-result, approve, rework, reject, cancel]
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCommand' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/Problem' }
