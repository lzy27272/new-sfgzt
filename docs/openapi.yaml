          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsDashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates:
    get:
      tags: [Enterprise Template]
      operationId: listEnterpriseTemplates
      summary: List task and hotel-dashboard templates visible to the caller
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [TASK, HOTEL_DASHBOARD] }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Enterprise Template]
      operationId: createEnterpriseTemplate
      summary: Create a CEO-managed template and its first draft version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnterpriseTemplate' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates/{templateId}:
    get:
      tags: [Enterprise Template]
      operationId: getEnterpriseTemplate
      summary: Get template metadata and all immutable versions
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/templates/{templateId}/versions:
    post:
      tags: [Enterprise Template]
      operationId: createEnterpriseTemplateVersion
      summary: Create a new editable draft from a published template
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnterpriseTemplateVersion' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/templates/{templateId}/versions/{versionId}:
    put:
      tags: [Enterprise Template]
      operationId: updateEnterpriseTemplateVersion
      summary: Update an editable template draft using optimistic locking
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEnterpriseTemplateVersion' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates/{templateId}/versions/{versionId}/publish:
    post:
      tags: [Enterprise Template]
      operationId: publishEnterpriseTemplateVersion
      summary: Publish a template version and retire the preceding published version
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishEnterpriseTemplateVersion' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels:
    get:
      tags: [Store Resource]
      operationId: listStoreResourceHotels
      summary: List hotels visible to the current identity for inventory and asset management
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/usage-catalog:
    get:
      tags: [Store Resource]
      operationId: getWorkUsageCatalogue
      summary: Get current employee hotel actual-use item list without stock balances or costs
      description: Requires work-record.submit, or both work-record.review and store-resource.read, plus the caller's current active business assignment within the requested hotel (administrative hotel scope alone does not impersonate an employee). Returns only active employee-enabled items matching that assignment's department ancestry AND optional position restrictions; explicit ALL_DEPARTMENTS items remain shared subject to position restrictions. LEGACY items are excluded until an administrator configures their scope. Includes enabled, reviewer_available, department_configured, unconfigured_item_count, base/issue units, row versions and usage_scope_kind (POSITION, DEPARTMENT or SHARED); quick_list.item_ids is intersected with the same eligible items. Missing department affiliation never guesses from a job name. Issue and usage submission recheck the identical scope, including zero and blank daily rows. Optional businessDate and itemCode resolve an existing complementary HKA_DAILY_REPORT/HKA_USAGE_RETURN record for this employee; reference_usage preserves historical submitted evidence, is informational and causes no stock write.
      parameters:
        - name: orgUnitId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { name: businessDate, in: query, schema: { type: string, format: date } }
        - { name: itemCode, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/usage-review-config:
    get:
      tags: [Store Resource]
      operationId: getWorkUsageReviewConfig
      summary: Get hotel opt-in consumption reviewer configuration
      description: Requires store-resource.read and authorized hotel scope. Missing configuration means enabled=false and row_version=-1; legacy reporting does not post inventory.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Store Resource]
      operationId: configureWorkUsageReviewer
      summary: Explicitly enable hotel consumption linkage and configure its reviewer
      description: Requires store-resource.item-manage and hotel scope. Reviewer must have an active assignment in this hotel, work-record.review, store-resource.read and ui.module.store-resources. Pending records follow the new reviewer; submission snapshots remain unchanged. Uses optimistic configuration version, -1 for initial opt-in.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigureWorkUsageReviewer' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/usage-reviewers:
    get:
      tags: [Store Resource]
      operationId: listWorkUsageReviewers
      summary: List eligible consumption reviewer assignments in this hotel
      description: Requires store-resource.item-manage and hotel scope; does not grant any new permissions.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/work-usage:
    get:
      tags: [Store Resource]
      operationId: listWorkUsages
      summary: List the most recent 100 consumption records with immutable item snapshots
      description: Requires store-resource.read and hotel scope. Returns can_review and record_version. Review uses the existing work-data record review action; configured reviewer or platform administrator only, no self review. Approval, work status and stock ledger post atomically; linen is usage-only. Identical review retries do not deduct again.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, REVERSED, ALL], default: PENDING }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/work-usage/{recordId}/reverse:
    post:
      tags: [Store Resource]
      operationId: reverseWorkUsage
      summary: Reverse approved consumption by adding opposite ledger entries
      description: Requires store-resource.movement-create and hotel scope. Restores original quantities and costs, never deletes history or changes work completion. Repeated identical reasons return the same reversed record; different reasons conflict. Corrected actual consumption requires a separately authorized adjustment with an audit reason.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/work-usage/{recordId}/correct:
    post:
      tags: [Store Resource]
      operationId: correctWorkUsage
      summary: Replace approved quantities and atomically synchronize stock and cost with immutable revisions
      description: Requires work-record.review, store-resource.read, hotel scope and the current configured reviewer or platform administrator. No self-review. expectedVersion is the correction_version, initially zero, not work-record row version. Restore the previous revision at its original value, then post replacement quantities at current weighted-average value. Missing stock or invalid configuration rolls back the entire command. Linen remains quantity-only. Repeated identical actor, expected version and request is idempotent; stale or different requests conflict. Original work record, evidence and closed-month snapshots remain immutable. Live business-date operating totals are updated.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantities, expectedVersion, reason]
              properties:
                quantities: { type: object, description: 'schemaVersion 1, noUsage boolean, lines array of itemId, quantity, unit, expectedItemVersion; 1-100 unique active items or explicit noUsage with empty lines.' }
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/costs/operating-summary:
    get:
      tags: [Store Resource]
      operationId: storeOperatingCostSummary
      summary: Yesterday and month-to-yesterday cost cards with daily monthly and custom period queries
      description: Requires daily-operation.read and store-resource.read plus full authorized hotel scope. Read-only REPEATABLE_READ snapshot. roomUseBasis is ALL_ROOM_USES_V1 and dateBasis BUSINESS_DATE_LIVE. Returns yesterday, monthToYesterday and selected windows, nullable amount/perRoomUse and quality reasons. Only consumables, cleaning supplies and accepted laundry costs are included, not rent, payroll, utilities or depreciation. Original business-date aggregation reflects corrections without changing financial posting-date closes. PMS gaps or zero use, pending consumption, unpriced/legacy costs and absent cost records never produce fabricated ratios. Custom period supports at most 1096 inclusive days through local yesterday. On month day 1 the current-month window is empty, never substituted with the previous month. Currency and denominator are exact decimal text.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - { name: periodType, in: query, schema: { type: string, enum: [DAY, MONTH, CUSTOM], default: MONTH } }
        - { name: period, in: query, schema: { type: string }, description: 'YYYY-MM-DD for DAY or YYYY-MM for MONTH; empty defaults to yesterday or current month.' }
        - { name: from, in: query, schema: { type: string, format: date }, description: Required for CUSTOM. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Required for CUSTOM. }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/costs:
    get:
      tags: [Store Resource]
      operationId: storeCostMonthPreview
      summary: Preview monthly cost or read the immutable closed-month snapshot
      description: Requires store-resource.read and hotel scope. Monetary values and quantities are exact decimal strings. Separates consumption and qualified laundry fees, loss and inventory adjustments. Purchases, opening inventory and asset original values are not operating expenses. Includes daily/item aggregates, pending usage, outstanding laundry, zero amounts and legacy classification warnings. Default month uses the tenant timezone. previewToken covers a consistent committed snapshot.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/costs/per-room-use:
    get:
      tags: [Store Resource]
      operationId: storeCostPerRoomUse
      summary: Read daily or monthly consumable, cleaning and laundry cost per verified PMS room use
      description: Requires store-resource.read and hotel scope. Read-only management analysis, never a KPI or month-close write. Explicit tenant binding plus unique hotel-profile ID and property code mapping are mandatory. ALL_ROOM_USES_V1 requires an inclusive totalRoomUses with a confirmed ROOM_USE and EACH_USE definition including overnight, complimentary, house-use and hourly uses. Two uses of the same room on one business day count as two, with no room-number deduplication and no hourly conversion. A confirmed total alone is sufficient; four mutually exclusive categories are optional. Supplied categories must be nonnegative integer counts and cannot exceed the total; a complete breakdown must sum exactly to it. Partial categories are omitted, never zero-filled. Optional category availability does not change comparability. Old equivalent room-nights and legacy overnight-only data are never substituted. Numerator is posting-date cost in the same date range; monthly cost is total cost divided by summed uses, not the average of daily rates. Defaults to MONTH/current month through the last closed business day (cutoff and grace included); DAY defaults to last closed day. Missing, incomplete, unverified or zero-use data and absent or unpriced cost records never produce misleading zero ratios. Comparisons use matched periods and exact ratios. Definition changes and non-positive baselines are not percentage-comparable. Uses are integer text; monetary values and percentages are exact decimal text. PMS revision may change this live analysis without changing the immutable cost month close. No raw vendor data, credentials or filesystem paths are returned.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - { name: periodType, in: query, schema: { type: string, enum: [DAY, MONTH], default: MONTH } }
        - name: period
          in: query
          description: DAY uses YYYY-MM-DD; MONTH uses YYYY-MM. Optional, from year 2000 through current date only.
          schema: { type: string }
      responses:
        '200':
          description: Analysis with per-metric readiness, comparison reasons and source provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomUseCostAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/costs/per-room-night:
    get:
      tags: [Store Resource]
      operationId: storeCostPerRoomNightLegacyAlias
      deprecated: true
      summary: Deprecated path alias for per-room-use; returns the new versioned room-use contract
      description: Same store-resource.read permission and hotel scope as per-room-use. Returns roomUseBasis ALL_ROOM_USES_V1, roomUses and perRoomUse; no legacy roomNightBasis or perRoomNight values. Clients must check the new basis and must not display it as room-nights.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - { name: periodType, in: query, schema: { type: string, enum: [DAY, MONTH], default: MONTH } }
        - { name: period, in: query, schema: { type: string }, description: DAY uses YYYY-MM-DD; MONTH uses YYYY-MM. }
      responses:
        '200':
          description: Versioned room-use analysis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomUseCostAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/costs/entries:
    get:
      tags: [Store Resource]
      operationId: storeCostEntries
      summary: Paginated immutable cost evidence with source and correction references
      description: Requires store-resource.read and hotel scope. 50 entries per page with hasMore. Filters use posting date, not original business date. Reversals retain the original business date and are negative entries in the correction month. Closed months never acquire additional entries; backdated postings into a closed month move to the current tenant month.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: kind, in: query, schema: { type: string, enum: [ALL, CONSUMABLE, CLEANING_SUPPLY, OPERATING_ITEM, LINEN_USAGE, LAUNDRY, LOSS, ADJUSTMENT], default: ALL } }
        - { name: day, in: query, schema: { type: string, format: date }, description: Optional posting date within the selected month. }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/costs/closed-months:
    get:
      tags: [Store Resource]
      operationId: storeCostClosedMonths
      summary: Read historical month-close totals, operator, note and timestamp
      description: Requires store-resource.read and hotel scope. 12 monthly snapshots per page with hasMore.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/costs/close:
    post:
      tags: [Store Resource]
      operationId: closeStoreCostMonth
      summary: Confirm an ended month and retain an immutable cost snapshot
      description: Requires both store-resource.cost-close and store-resource.read with hotel scope. Only ended months; pending usage must be approved or rejected first. Requires a fresh previewToken, explicit warning acknowledgment and a note. Uses an exclusive per-hotel accounting lock against shared posting locks. Same month/token/note retry returns the existing result; conflicts never overwrite it. No reopen or direct historical rewrite endpoint. Late entries and reversals remain auditable in the current month.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseStoreCostMonth' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/laundry/catalog:
    get:
      tags: [Store Resource]
      operationId: laundryCatalog
      summary: Active linen, laundry prices and owned / in-laundry / available quantities
      description: Requires store-resource.read and hotel scope. Prices are per base unit, independent of purchase cost. Missing prices are null, not zero. Availability is owned quantity minus outstanding laundry custody.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/laundry/rates/{itemId}:
    put:
      tags: [Store Resource]
      operationId: configureLaundryRate
      summary: Configure the laundry price for new dispatches only
      description: Requires store-resource.item-manage and hotel scope. Checks item and rate versions. expectedVersion=-1 creates the first price. Base unit and linen category become immutable. Existing dispatch snapshots never change.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreResourceItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigureLaundryRate' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/laundry/orders:
    get:
      tags: [Store Resource]
      operationId: listLaundryOrders
      summary: Paginated laundry orders with effective charges
      description: Requires store-resource.read and hotel scope. Returns items, page and hasMore, 25 orders per page. Charges exclude reversed receipts. Historical orders remain queryable. Aggregate quantities across different base units must not be displayed as a single physical unit.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [ALL, OPEN, COMPLETED, CANCELLED], default: ALL }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Store Resource]
      operationId: dispatchLaundry
      summary: Freeze quantities and laundry prices without consuming linen stock
      description: Requires store-resource.movement-create and hotel scope. Idempotency-Key is required, at most 160 characters. All quantities use base units. Locks items in a stable order; outstanding laundry cannot be dispatched or consumed again. Only active linen with configured prices is allowed. Identical retries return the existing order, changed payloads conflict. Future actual dates are rejected using tenant timezone.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchLaundry' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/laundry/orders/{orderId}:
    get:
      tags: [Store Resource]
      operationId: laundryOrderDetail
      summary: Read frozen dispatch lines and complete receipt / reversal history
      description: Requires store-resource.read and hotel scope. Status is SENT, PARTIAL, COMPLETED or CANCELLED; each receipt is POSTED or REVERSED. Lines retain original item names, base units and prices. Returns row_version for corrections and receipts. No attachments are removed by this workflow.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/LaundryOrderId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/laundry/orders/{orderId}/receipts:
    post:
      tags: [Store Resource]
      operationId: receiveLaundry
      summary: Accept partial returns, record rewash and explicitly confirm losses
      description: Requires store-resource.movement-create and hotel scope. Idempotency-Key at most 160 characters. The order version serializes receipt and correction commands. acceptedQuantity generates a four-decimal fee at frozen unitPrice; rewashQuantity remains outstanding and generates no fee; writtenOffQuantity needs confirmWriteOff=true and a reason, and posts a separate weighted-average DAMAGE stock movement. All effects are atomic. Sum of these quantities cannot exceed outstanding custody. Receipt date must be between dispatch date and today. Returns refreshed order detail.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/LaundryOrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveLaundry' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/laundry/orders/{orderId}/cancel:
    post:
      tags: [Store Resource]
      operationId: cancelLaundryOrder
      summary: Cancel an order only when no effective receipt exists
      description: Requires store-resource.movement-create and hotel scope. Releases custody but preserves all facts. Previously reversed receipts do not block cancellation. Same-reason retries return existing cancellation; changed reasons conflict.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/LaundryOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectLaundry' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/laundry/orders/{orderId}/receipts/{receiptId}/reverse:
    post:
      tags: [Store Resource]
      operationId: reverseLaundryReceipt
      summary: Reverse one receipt, preserving original facts and restoring original loss costs
      description: Requires store-resource.movement-create and hotel scope. Receipt fees stop contributing to current effective charges. Compensating stock entries restore original write-off quantities and original values; custody is reinstated. Rejects if subsequent dispatches or outflows mean restored custody would exceed owned linen. Atomic, version-checked, same-reason idempotent. Future monthly accounting must use received_on and reversed_at separately, not rewrite closed months from this current-effective view.
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/LaundryOrderId'
        - $ref: '#/components/parameters/LaundryReceiptId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectLaundry' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/items:
    get:
      tags: [Store Resource]
      operationId: listStoreResourceItems
      summary: List configured consumables, linen, cleaning supplies and operating items
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Store Resource]
      operationId: createStoreResourceItem
      summary: Create a hotel inventory item configuration
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStoreResourceItem' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/usage-scope-options:
    get:
      tags: [Store Resource]
      operationId: getStoreItemUsageScopeOptions
      summary: Get active departments of this hotel and active tenant-wide position definitions
      description: Requires store-resource.item-manage and hotel scope. Returns departments and positions arrays with id, code and name. No staff records or extra permissions are exposed. Position definitions are not limited to currently staffed positions.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/summary:
    get:
      tags: [Store Resource]
      operationId: getStoreResourceSummary
      summary: Get item, low-stock, fixed-asset, open-handover and inventory-value totals
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/items/{itemId}:
    put:
      tags: [Store Resource]
      operationId: updateStoreResourceItem
      summary: Update a hotel inventory item using optimistic locking
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreResourceItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStoreResourceItem' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Store Resource]
      operationId: deactivateStoreResourceItem
      summary: Deactivate an inventory item that is no longer used
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreResourceItemId'
      responses:
        '204': { description: Item deactivated }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/items/{itemId}/actions/enable:
    post:
      tags: [Store Resource]
      operationId: enableStoreResourceItem
      summary: Enable an inventory item using optimistic locking
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreResourceItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreResourceVersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/items/{itemId}/actions/disable:
    post:
      tags: [Store Resource]
      operationId: disableStoreResourceItem
      summary: Disable an inventory item using optimistic locking
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreResourceItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreResourceVersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/balances:
    get:
      tags: [Store Resource]
      operationId: listStoreInventoryBalances
      summary: List current item quantities, values and low-stock state for a hotel
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/movements:
    get:
      tags: [Store Resource]
      operationId: listStoreInventoryMovements
      summary: List the append-only inventory movement ledger for a hotel
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Store Resource]
      operationId: createStoreInventoryMovement
      summary: Record an idempotent receipt, consumption, return, damage or adjustment
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStoreInventoryMovement' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/assets:
    get:
      tags: [Store Resource]
      operationId: listStoreFixedAssets
      summary: List fixed assets for a hotel
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: includeRetired
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Store Resource]
      operationId: createStoreFixedAsset
      summary: Register a fixed asset
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStoreFixedAsset' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/assets/{assetId}:
    put:
      tags: [Store Resource]
      operationId: updateStoreFixedAsset
      summary: Update a fixed asset using optimistic locking
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreFixedAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStoreFixedAsset' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Store Resource]
      operationId: retireStoreFixedAsset
      summary: Retire a fixed asset
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreFixedAssetId'
      responses:
        '204': { description: Asset retired }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/assignment-options:
    get:
      tags: [Store Resource]
      operationId: listStoreResourceAssignmentOptions
      summary: List active same-hotel assignments eligible for asset responsibility or handover roles
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/imports/template:
    get:
      tags: [Store Resource]
      operationId: downloadStoreResourceImportTemplate
      summary: Download the controlled new-store inventory and fixed-asset XLSX template
      description: V3 adds required usage departments and optional usage positions, plus a read-only reference sheet populated from this hotel and tenant. Names or codes are resolved against current server data, not the uploaded reference sheet. Semicolons separate selections. V1/V2 files remain supported with LEGACY usage scope, never implicitly all departments. Apply revalidates references; no partial writes on failure.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200':
          description: XLSX import template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/imports:
    get:
      tags: [Store Resource]
      operationId: listStoreResourceImportJobs
      summary: List recent import validation and application results for a hotel
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/imports/preview:
    post:
      tags: [Store Resource]
      operationId: previewStoreResourceImport
      summary: Scan, parse and validate a workbook without writing business records
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/hotels/{hotelId}/imports/{importJobId}/errors:
    get:
      tags: [Store Resource]
      operationId: downloadStoreResourceImportErrors
      summary: Download row-level validation errors as XLSX
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreResourceImportJobId'
      responses:
        '200':
          description: XLSX validation error workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/store-resources/hotels/{hotelId}/imports/{importJobId}/actions/apply:
    post:
      tags: [Store Resource]
      operationId: applyStoreResourceImport
      summary: Atomically apply a validated import exactly once
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/StoreResourceImportJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/hotels/{hotelId}/handovers:
    get:
      tags: [Store Resource]
      operationId: listStoreResourceHandovers
      summary: List inventory and asset handovers for a hotel
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Store Resource]
      operationId: createStoreResourceHandover
      summary: Create a three-party handover and take an immutable book snapshot
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStoreResourceHandover' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/handovers/{handoverId}:
    get:
      tags: [Store Resource]
      operationId: getStoreResourceHandover
      summary: Get a handover with snapshot lines and immutable action history
      parameters:
        - $ref: '#/components/parameters/StoreResourceHandoverId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/store-resources/handovers/{handoverId}/actions/dispute-decision:
    post:
      tags: [Store Resource]
      operationId: decideStoreResourceHandoverDispute
      summary: Record whether the recipient disputes the generated book snapshot
      parameters:
        - $ref: '#/components/parameters/StoreResourceHandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreResourceDisputeDecision' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/handovers/{handoverId}/actions/physical-count:
    post:
      tags: [Store Resource]
      operationId: recordStoreResourceHandoverPhysicalCount
      summary: Record physical counts and asset states when the snapshot is disputed
      parameters:
        - $ref: '#/components/parameters/StoreResourceHandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreResourcePhysicalCount' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/handovers/{handoverId}/actions/transferor-confirm:
    post:
      tags: [Store Resource]
      operationId: confirmStoreResourceHandoverTransferor
      summary: Confirm the handover as the transferor
      parameters:
        - $ref: '#/components/parameters/StoreResourceHandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreResourceVersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/handovers/{handoverId}/actions/recipient-confirm:
    post:
      tags: [Store Resource]
      operationId: confirmStoreResourceHandoverRecipient
      summary: Confirm the handover as the recipient
      parameters:
        - $ref: '#/components/parameters/StoreResourceHandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreResourceVersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/store-resources/handovers/{handoverId}/actions/approve:
    post:
      tags: [Store Resource]
      operationId: approveStoreResourceHandover
      summary: Approve or reject the handover as its configured approver
      parameters:
        - $ref: '#/components/parameters/StoreResourceHandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveStoreResourceHandover' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Trusted production JWT or SSO access token.
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
      description: Local integration only; requires DEV_HEADER_AUTH_ENABLED=true.
    ActorHeader:
      type: apiKey
      in: header
      name: X-Actor-Id
      description: Local integration only; requires DEV_HEADER_AUTH_ENABLED=true.
  parameters:
    EmployeeId: { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    StandardId: { name: standardId, in: path, required: true, schema: { type: string, format: uuid } }
    TemplateId: { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    EvidenceId: { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    FormId: { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    RecordId: { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkPackageId: { name: workPackageId, in: path, required: true, schema: { type: string, format: uuid } }
    ExpectationId: { name: expectationId, in: path, required: true, schema: { type: string, format: uuid } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    HotelId: { name: hotelId, in: path, required: true, schema: { type: string, format: uuid } }
    StoreResourceItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    LaundryOrderId: { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    LaundryReceiptId: { name: receiptId, in: path, required: true, schema: { type: string, format: uuid } }
    StoreFixedAssetId: { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    StoreResourceHandoverId: { name: handoverId, in: path, required: true, schema: { type: string, format: uuid } }
    StoreResourceImportJobId: { name: importJobId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; reuse returns the original semantic result.
      schema: { type: string, minLength: 1, maxLength: 200 }
    AssignmentHeader:
      name: X-Assignment-Id
      in: header
      required: false
      description: >-
        Selects the current responsibility-bearing business actor assignment without
        replacing or narrowing account-level roles and permissions.
      schema: { type: string, format: uuid }
  responses:
    ListResponse:
      description: List response
      content:
        application/json:
          schema:
            type: array
            items: { type: object, additionalProperties: true }
    ObjectResponse:
      description: Object response
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid or inactive identity
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Permission denied or organization scope violation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found in the authorized tenant and hotel scope
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Optimistic version or idempotency conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [title, status, detail, code]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [AUTHENTICATION_FAILED, BUSINESS_ASSIGNMENT_REQUIRED, BUSINESS_ASSIGNMENT_INVALID_FORMAT, BUSINESS_ASSIGNMENT_FORBIDDEN, BUSINESS_ACTOR_MISMATCH, BUSINESS_ASSIGNMENT_ROLE_MISMATCH, ACCESS_DENIED, REQUEST_INVALID, RESOURCE_NOT_FOUND, FEATURE_NOT_ENABLED, EXECUTIVE_TASK_TARGET_FORBIDDEN, EXECUTIVE_TASK_ACTION_FORBIDDEN, TASK_VERSION_CONFLICT, TASK_STATE_CONFLICT, IDEMPOTENCY_STATE_UNAVAILABLE, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_STATE_CONFLICT]
    EffectiveIdentity:
      type: object
      required: [tenantId, account, roles, permissions, tenantScope, organizationScopes, positionAssignments, capabilities]
      properties:
        tenantId: { type: string, format: uuid }
        account: { type: object, additionalProperties: true }
        employee: { type: [object, 'null'], additionalProperties: true }
        primaryRole: { type: [string, 'null'] }
        roles: { type: array, uniqueItems: true, items: { type: string } }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
        tenantScope: { type: boolean }
        organizationScopes: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        positionAssignments: { type: array, items: { $ref: '#/components/schemas/PositionAssignment' } }
        businessActorAssignmentId: { type: [string, 'null'], format: uuid }
        capabilities: { $ref: '#/components/schemas/IdentityCapabilities' }
    PositionAssignment:
      type: object
      additionalProperties: false
      required: [id, organizationId, organizationCode, organizationName, positionId, positionCode, positionName, primary, assignmentType, validFrom, permissionCodes, authorizationScopeType, wecomSelfSelectable]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationCode: { type: string }
        organizationName: { type: string }
        positionId: { type: string, format: uuid }
        positionCode: { type: string }
        positionName: { type: string }
        primary: { type: boolean }
