        reportPolicy: { type: object, additionalProperties: true, description: Daily-report projection, label, evidence and exception controls }
        applicabilityPolicy: { type: object, additionalProperties: true, description: Holiday dates, workday overrides and other applicability facts }
        executionPolicy: { type: object, additionalProperties: true, description: Runtime enablement and execution controls }
    WorkSubmissionPolicy:
      type: object
