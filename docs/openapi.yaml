      properties:
        positionAssignmentId: { type: string, format: uuid }
        targetOrgUnitId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        periodType: { type: string }
        dutyPeriodId: { type: [string, 'null'], format: uuid }
    WorkExpectationSlaProcessResult:
      type: object
      required: [processedCount, batchLimit, expectationIds, processedAt]
      properties:
        processedCount:
          type: integer
          minimum: 0
          description: Expectations changed to MISSED in this pass.
        batchLimit:
          type: integer
          minimum: 1
          maximum: 500
          description: Validated maximum candidate count for this pass.
        expectationIds:
          type: array
          description: Ordered IDs changed to MISSED and emitted to the outbox.
          items: { type: string, format: uuid }
        processedAt:
          type: string
          format: date-time
          description: UTC completion timestamp for this pass.
    ExpectationAction:
      type: object
      required: [reason, expectedVersion]
      properties:
        reason: { type: string }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    CreateForm:
      type: object
      required: [code, name, formType]
      properties:
        code: { type: string }
        name: { type: string }
        formType: { type: string, enum: [DAILY_WORK, INSPECTION, COMPLAINT, EXCEPTION, FEEDBACK] }
        positionId: { type: [string, 'null'], format: uuid }
    CreateFormVersion:
      type: object
      required: [jsonSchema]
      properties:
        jsonSchema: { type: object, additionalProperties: true }
        uiSchema: { type: [object, 'null'], additionalProperties: true }
    ConfigureWorkUsageReviewer:
      type: object
      required: [reviewerAssignmentId, expectedVersion]
      properties:
        reviewerAssignmentId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: -1 }
    RoomUseCostAnalysis:
      type: object
      required: [periodType, selection, currentMonth, latestClosedDay, businessTimezone, costTimezone, generatedAt, roomUseBasis, current, previous, yearAgo, comparisons, notices]
      properties:
        periodType: { type: string, enum: [DAY, MONTH] }
        selection: { type: string }
        currentMonth: { type: string }
        latestClosedDay: { type: string, format: date }
        businessTimezone: { type: string }
        costTimezone: { type: string }
        generatedAt: { type: string, format: date-time }
        roomUseBasis: { type: string, const: ALL_ROOM_USES_V1, description: Reject legacy overnight-only or equivalent room-night responses; count each use instead. }
        current: { $ref: '#/components/schemas/RoomUseCostWindow' }
        previous: { $ref: '#/components/schemas/RoomUseCostWindow' }
        yearAgo: { $ref: '#/components/schemas/RoomUseCostWindow' }
        comparisons:
          type: array
          items:
            type: object
            required: [kind, previous, yearAgo]
            properties:
              kind: { type: string }
              previous: { $ref: '#/components/schemas/RoomUseCostChange' }
              yearAgo: { $ref: '#/components/schemas/RoomUseCostChange' }
        notices: { type: array, items: { type: string } }
    RoomUseCostWindow:
      type: object
      required: [from, to, costMonthClosed, pendingUsageCount, shiftedEntryCount, source, costs]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: May precede from when the current month has no closed business day yet. }
        costMonthClosed: { type: boolean }
        pendingUsageCount: { type: integer }
        shiftedEntryCount: { type: integer }
        source:
          type: object
          required: [state, reason, coveredDays, expectedDays, missingDates]
          properties:
            state: { type: string, enum: [READY, ZERO_USES, NOT_CONNECTED, NOT_MAPPED, SOURCE_ERROR, PERIOD_OPEN, NO_DATA, INCOMPLETE, UNVERIFIED, DUPLICATE, DEFINITION_CHANGED, DATE_BASIS_MISMATCH] }
            reason: { type: string }
            roomUses: { type: [string, 'null'], pattern: '^\d+$', description: Confirmed inclusive integer usage count. Two uses of the same room count twice; no hourly conversion. ZERO_USES cannot be divided. }
            candidateRoomUses: { type: [string, 'null'], pattern: '^\d+$', description: Unconfirmed quantity for reconciliation only, never a denominator. }
            breakdown:
              $ref: '#/components/schemas/RoomUseBreakdown'
              description: Optional even for READY or ZERO_USES. Null unless all four categories are verified for the entire period; total-only evidence remains usable and comparable. Missing components are never assumed to be zero.
            coveredDays: { type: integer }
            expectedDays: { type: integer }
            missingDates: { type: array, items: { type: string, format: date } }
            mode: { type: string, enum: [DAILY, PERIOD_SUMMARY] }
            definitionLabel: { type: string }
            definitionKey: { type: string, description: Comparable definition identity, not a source credential. }
            collectedAt: { type: string, format: date-time }
            revision: { type: string, pattern: '^[a-f0-9]{64}$' }
        costs:
          type: array
          items:
            type: object
            required: [kind, amount, entryCount, zeroAmountCount, legacyCount, state, reason]
            properties:
              kind: { type: string, enum: [CONSUMABLE, CLEANING_SUPPLY, LAUNDRY] }
              amount: { type: string, pattern: '^-?\d+\.\d{4}$' }
              entryCount: { type: integer }
              zeroAmountCount: { type: integer }
              legacyCount: { type: integer }
              state: { type: string }
              reason: { type: string }
              perRoomUse: { type: [string, 'null'], pattern: '^-?\d+\.\d{4}$', description: Yuan per use; null or omitted unless cost and confirmed nonzero total-use count are ready. }
    RoomUseBreakdown:
      type: [object, 'null']
      description: Optional four mutually exclusive integer counts in ROOM_USE units; free or house-use hourly uses belong only to their respective category. No hourly conversion or same-room deduplication. Complete categories must sum to the total. No actual cost allocation by category is implied.
      required: [paidOvernightRoomUses, complimentaryRoomUses, houseUseRoomUses, paidHourlyRoomUses]
      properties:
        paidOvernightRoomUses: { type: string, pattern: '^\d+$' }
        complimentaryRoomUses: { type: string, pattern: '^\d+$' }
        houseUseRoomUses: { type: string, pattern: '^\d+$' }
        paidHourlyRoomUses: { type: string, pattern: '^\d+$' }
    RoomUseCostChange:
      type: object
      required: [state, reason]
      properties:
        state: { type: string, enum: [READY, NOT_COMPARABLE, DEFINITION_CHANGED, NON_POSITIVE_BASE] }
        reason: { type: string }
        percent: { type: string, pattern: '^-?\d+\.\d{2}$', description: Positive indicates an increase in cost, not necessarily a performance improvement. }
    CloseStoreCostMonth:
      type: object
      required: [month, previewToken, note, acknowledgeWarnings]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        previewToken: { type: string, pattern: '^[a-f0-9]{64}$' }
        note: { type: string, minLength: 1, maxLength: 1000 }
        acknowledgeWarnings: { type: boolean, const: true }
    ConfigureLaundryRate:
      type: object
      required: [unitPrice, expectedVersion, expectedItemVersion]
      properties:
        unitPrice: { type: [number, string], description: 'Nonnegative price per base unit, at most 14 integer and 4 fractional digits. Zero explicitly means free laundry.' }
        expectedVersion: { type: integer, format: int64, minimum: -1 }
        expectedItemVersion: { type: integer, format: int64, minimum: 0 }
    DispatchLaundry:
      type: object
      required: [supplier, dispatchedOn, lines]
      properties:
        supplier: { type: string, minLength: 1, maxLength: 160 }
        dispatchedOn: { type: string, format: date }
        note: { type: [string, 'null'], maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [itemId, quantity, expectedRateVersion, expectedItemVersion]
            properties:
              itemId: { type: string, format: uuid }
              quantity: { type: [number, string], description: 'Positive base-unit quantity, at most 14 integer and 4 fractional digits.' }
              expectedRateVersion: { type: integer, format: int64, minimum: 0 }
              expectedItemVersion: { type: integer, format: int64, minimum: 0 }
    ReceiveLaundry:
      type: object
      required: [receivedOn, expectedVersion, lines]
      properties:
        receivedOn: { type: string, format: date }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        confirmWriteOff: { type: boolean, default: false }
        note: { type: [string, 'null'], maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [lineId, acceptedQuantity, rewashQuantity, writtenOffQuantity]
            properties:
              lineId: { type: string, format: uuid }
              acceptedQuantity: { type: [number, string], description: 'Nonnegative base-unit quantity, maximum 4 fractional digits.' }
              rewashQuantity: { type: [number, string], description: 'Remains at laundry, generates no fee. Positive quantity requires a differenceReason.' }
              writtenOffQuantity: { type: [number, string], description: 'Final confirmed loss, separate inventory DAMAGE entry. Requires confirmWriteOff and differenceReason.' }
              differenceReason: { type: [string, 'null'], maxLength: 1000 }
    CorrectLaundry:
      type: object
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    WorkUsageInput:
      type: object
      description: Set payload.inventoryQuantities for assigned HKA_USAGE_RETURN, NSA_DAILY_HANDOVER or inventoryUsage-enabled work items in opted-in hotels. Draft does not post; submission freezes item rules; review approves and posts once. Explicit noUsage=true requires no lines. Morning issue and daily summary are not consumption postings.
      required: [schemaVersion, noUsage, lines]
      properties:
        schemaVersion: { type: integer, const: 1 }
        noUsage: { type: boolean }
        lines:
          type: array
          maxItems: 100
          items:
            type: object
            required: [itemId, quantity, unit, expectedItemVersion]
            properties:
              itemId: { type: string, format: uuid }
              quantity: { type: string, description: 'Positive decimal with up to 4 fractional digits; conversion must also fit NUMERIC(18,4).' }
              unit: { type: string, description: Configured base or issue unit only }
              expectedItemVersion: { type: integer, format: int64, minimum: 0 }
    SubmitWorkRecord:
      type: object
      required: [orgUnitId, employeeId, positionAssignmentId, formVersionId, businessDate, payload]
      properties:
        orgUnitId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        positionAssignmentId: { type: string, format: uuid }
        formVersionId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        payload: { type: object, additionalProperties: true }
        workPackageVersionId: { type: [string, 'null'], format: uuid }
        workPackageItemId: { type: [string, 'null'], format: uuid }
        workExpectationId: { type: [string, 'null'], format: uuid }
        recordKind: { type: [string, 'null'] }
        targetOrgUnitId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: [string, 'null'], format: date-time }
        supersedesWorkRecordId: { type: [string, 'null'], format: uuid }
        saveAsDraft: { type: [boolean, 'null'] }
        completionStatement: { type: [string, 'null'] }
        exceptionStatement: { type: [string, 'null'] }
        nextAction: { type: [string, 'null'] }
    UpdateWorkRecordDraft:
      type: object
      required: [payload, expectedVersion]
      properties:
        payload: { type: object, additionalProperties: true }
        occurredAt: { type: [string, 'null'], format: date-time }
        completionStatement: { type: [string, 'null'] }
        exceptionStatement: { type: [string, 'null'] }
        nextAction: { type: [string, 'null'] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    AddWorkRecordSupplement:
      type: object
      required: [submittedByAssignmentId, content]
      properties:
        submittedByAssignmentId: { type: string, format: uuid }
        content: { type: string, minLength: 1 }
    SubmitWorkRecordDraft:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    ReviewWorkRecord:
      type: object
      required: [outcome, expectedVersion]
      properties:
        outcome: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: [string, 'null'] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      allOf:
        - if:
            properties:
              outcome: { const: REJECTED }
          then:
            required: [reason]
            properties:
              reason: { type: string, minLength: 1 }
    AddAttachment:
      type: object
      required: [originalName, mediaType, sizeBytes]
      properties:
        originalName: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: [string, 'null'], pattern: '^[a-fA-F0-9]{64}$' }
    UploadedAttachment:
      type: object
      required: [id, workRecordId, objectKey, originalName, mediaType, sizeBytes, sha256, scanStatus, contentUrl]
      properties:
        id: { type: string, format: uuid }
        workRecordId: { type: string, format: uuid }
        objectKey: { type: string }
        originalName: { type: string }
        mediaType: { type: string, enum: [image/jpeg, image/png] }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        scanStatus:
          type: string
          enum: [CLEAN, BYPASSED_DEV]
          description: >-
            CLEAN is returned only after a configured scanner succeeds. BYPASSED_DEV is
            restricted to explicitly enabled development-header mode and is never accepted
            for download in formal mode.
        contentUrl: { type: string, pattern: '^/api/v1/work-data/attachments/.+/content$' }
    StoredAttachment:
      type: object
      required: [id, work_record_id, object_key, original_name, media_type, size_bytes, scan_status, created_at]
      properties:
        id: { type: string, format: uuid }
        work_record_id: { type: string, format: uuid }
