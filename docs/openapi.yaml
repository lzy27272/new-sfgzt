        workWindowEnd: { type: [string, 'null'], format: time }
        dueLocalTime: { type: [string, 'null'], format: time }
        graceMinutes: { type: [integer, 'null'], minimum: 0 }
        weekdays: { type: [array, 'null'], items: { type: integer, minimum: 1, maximum: 7 } }
        dayOfMonth: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        holidayPolicy: { type: [string, 'null'] }
        waiverAllowed: { type: [boolean, 'null'] }
        targetGranularity: { type: [string, 'null'] }
        reviewMode: { type: [string, 'null'] }
